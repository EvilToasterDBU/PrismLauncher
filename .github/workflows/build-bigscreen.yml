name: Build BigScreen

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [bigscreen-mode]
  pull_request:
    branches: [bigscreen-mode]
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Release

permissions: {}

jobs:
  build:
    name: Build BigScreen (${{ matrix.artifact-name }})

    permissions:
      contents: read
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Mandatory for now, per the BigScreen plan's v1 scope (Linux/
          # SteamOS only) — Windows/macOS need their own SDL2/OpenGL
          # backend wiring that hasn't been done, and
          # bigscreen/CMakeLists.txt's pkg-config-based SDL2/fmt/OpenGL
          # lookup assumes a Linux-like environment. Add matrix entries for
          # those (mirroring build.yml's os/cmake-preset/qt-version) once
          # that groundwork exists — the rest of this job (setup, configure
          # with -DLauncher_BUILD_BIGSCREEN=ON, package) is written to be
          # platform-agnostic already, only the dependency-install step
          # below is Linux-specific.
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.10.2

          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            cmake-preset: linux
            qt-version: 6.10.2

    runs-on: ${{ matrix.os }}

    env:
      ARTIFACT_NAME: PrismLauncherBigScreen-${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # BigScreen still links the full Launcher_logic (the whole Qt Widgets
      # desktop UI is compiled in, just never shown), so it needs the exact
      # same Qt/vcpkg setup the desktop build does — reuses the same
      # composite action build.yml uses.
      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ matrix.qt-version }}

      # Not part of the desktop build's own dependency set — only
      # bigscreen/CMakeLists.txt needs these (SDL2/OpenGL for the window
      # and input, fmt for the vendored ImGuiFullscreen toolkit). Installed
      # here rather than added to setup-dependencies/linux so the normal
      # desktop CI job doesn't pay for packages it never uses.
      - name: Install BigScreen-specific dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsdl2-dev libfmt-dev libgl1-mesa-dev

      ##
      # BUILD
      ##

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET" \
            -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -D Launcher_BUILD_BIGSCREEN=ON

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE" --target prismlauncher_bigscreen

      ##
      # PACKAGE
      ##

      # Same trimming the desktop build's own packaging action does before
      # bundling Qt plugins (.github/actions/package/linux/action.yml) —
      # none of these are ever used by BigScreen (no QWidget windows, no
      # printing, no SQL, no in-app help/designer/qml tooling), so there's
      # no reason to bundle them into the portable package.
      - name: Cleanup Qt installation on Linux
        run: |
          rm -rf "$QT_PLUGIN_PATH"/printsupport
          rm -rf "$QT_PLUGIN_PATH"/sqldrivers
          rm -rf "$QT_PLUGIN_PATH"/help
          rm -rf "$QT_PLUGIN_PATH"/designer
          rm -rf "$QT_PLUGIN_PATH"/qmltooling
          rm -rf "$QT_PLUGIN_PATH"/qmlls
          rm -rf "$QT_PLUGIN_PATH"/qmllint
          rm -rf "$QT_PLUGIN_PATH"/platformthemes/libqgtk3.so

      # A true "run from anywhere" package, not just a bare binary+assets
      # tarball (the previous version of this step) — that only worked on
      # a machine that happened to already have the exact right Qt/SDL2/fmt
      # shared libraries installed, which the user's own SteamOS/Deck
      # hardware won't. `sharun lib4bin` is the same tool, and the same
      # invocation shape, the desktop build's own portable-tarball packaging
      # already uses (.github/actions/package/linux/action.yml) — it
      # resolves every shared library prismlauncher_bigscreen and the
      # bundled Qt plugins need and copies them alongside the binary, so
      # the result runs standalone without relying on anything from the
      # host system's package manager. Already available on PATH: the
      # shared setup-dependencies action installs it (and mkappimage/
      # AppImageUpdate, unused here) for every Linux job, BigScreen's
      # included.
      #
      # No cmake --install step first (unlike the desktop build) — BigScreen
      # has no install() rules of its own yet, so the binary is placed into
      # a bin/ dir by hand before handing it to sharun.
      #
      # --hard-links is required, not optional: bigscreen/main.cpp's
      # relocatable-resources lookup and Application::getJarPath() both
      # resolve paths relative to the running executable via
      # /proc/self/exe / QCoreApplication::applicationDirPath() — sharun's
      # own docs single out --hard-links as specifically what keeps that
      # resolving to the real "bin/prismlauncher_bigscreen" path (where our
      # own resources/jars actually get copied to, below) rather than
      # somewhere inside sharun's internal shared/ tree. --with-hooks packs
      # the extra runtime-loaded files some of these libraries need beyond
      # plain link-time dependencies (Qt plugin manifests etc.).
      - name: Package
        run: |
          set -euo pipefail
          stage="PrismLauncherBigScreen-${{ matrix.artifact-name }}"
          mkdir -p "$stage/bin"
          cp "build/$BUILD_TYPE/prismlauncher_bigscreen" "$stage/bin/"

          sharun lib4bin \
            --hard-links \
            --with-hooks \
            --dst-dir "$stage" \
            "$stage"/bin/* "$QT_PLUGIN_PATH"/*/*.so

          # Must land next to the (hard-linked) binary in bin/ — that's
          # exactly what bigscreen/main.cpp's resource lookup and
          # Application::getJarPath() search for relative to the running
          # executable. jars/ (JavaCheck.jar + NewLaunch(Legacy).jar) is
          # already guaranteed to exist and be complete:
          # prismlauncher_bigscreen's own CMake target depends on all three
          # (bigscreen/CMakeLists.txt).
          cp -r bigscreen/resources "$stage/bin/"
          cp -r build/jars "$stage/bin/"

          tar -czf "$stage.tar.gz" "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncherBigScreen-${{ matrix.artifact-name }}-Qt6
          path: PrismLauncherBigScreen-${{ matrix.artifact-name }}.tar.gz
          if-no-files-found: error
