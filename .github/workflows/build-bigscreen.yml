name: Build BigScreen

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [bigscreen-mode]
  pull_request:
    branches: [bigscreen-mode]
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Release

permissions: {}

jobs:
  build:
    name: Build BigScreen (${{ matrix.artifact-name }})

    permissions:
      contents: read
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64/aarch64 (the primary SteamOS/handheld targets) and
          # Windows x64. macOS isn't wired up: bigscreen/CMakeLists.txt only
          # knows pkg-config (Linux) and vcpkg CONFIG packages (Windows) for
          # SDL2/fmt, and nothing has been tested there.
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.10.2
            glibc-arch: x86_64

          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            cmake-preset: linux
            qt-version: 6.10.2
            glibc-arch: aarch64

          # Same toolchain/Qt as build.yml's own Windows-MSVC desktop job
          # (setup-dependencies handles the VS dev shell, vcpkg triplet and
          # Qt install for it). x64 only for now: the Steamworks SDK has no
          # win-arm64 build, and no ARM64 Windows target has been asked for.
          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            vcvars-arch: amd64
            qt-version: 6.10.2

    runs-on: ${{ matrix.os }}

    # bash on Windows too (Git Bash on the runner), same as build.yml — so
    # the configure/build steps below stay one shared script. The VS dev
    # shell environment from setup-dependencies is exported via GITHUB_ENV
    # and visible here as well.
    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: PrismLauncherBigScreen-${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # BigScreen still links the full Launcher_logic (the whole Qt Widgets
      # desktop UI is compiled in, just never shown), so it needs the exact
      # same Qt/vcpkg setup the desktop build does — reuses the same
      # composite action build.yml uses.
      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      # Not part of the desktop build's own dependency set — only
      # bigscreen/CMakeLists.txt needs these (SDL2/OpenGL for the window
      # and input, fmt for the vendored ImGuiFullscreen toolkit). Installed
      # here rather than added to setup-dependencies/linux so the normal
      # desktop CI job doesn't pay for packages it never uses. zstd/xz-utils
      # are for the "Refresh glibc from Arch" step below (Arch packages are
      # .pkg.tar.zst, ALARM's are .pkg.tar.xz) — both are near-universally
      # preinstalled on Ubuntu already, but not guaranteed, so listed
      # explicitly rather than assumed.
      # Linux only — the Windows job gets SDL2/fmt through vcpkg instead
      # (the "bigscreen" manifest feature, enabled at configure time below).
      - name: Install BigScreen-specific dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsdl2-dev libfmt-dev libgl1-mesa-dev zstd xz-utils

      ##
      # BUILD
      ##

      - name: Configure project
        run: |
          # VCPKG_MANIFEST_FEATURES=bigscreen: SDL2 + fmt from vcpkg. Its
          # dependencies are platform-gated to Windows in vcpkg.json, so on
          # Linux (system packages via pkg-config) this adds nothing.
          cmake --preset "$CMAKE_PRESET" \
            -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -D VCPKG_MANIFEST_FEATURES=bigscreen \
            -D Launcher_BUILD_BIGSCREEN=ON

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE" --target prismlauncher_bigscreen

      ##
      # PACKAGE
      ##

      # Same trimming the desktop build's own packaging action does before
      # bundling Qt plugins (.github/actions/package/linux/action.yml) —
      # none of these are ever used by BigScreen (no QWidget windows, no
      # printing, no SQL, no in-app help/designer/qml tooling), so there's
      # no reason to bundle them into the portable package.
      - name: Cleanup Qt installation on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          rm -rf "$QT_PLUGIN_PATH"/printsupport
          rm -rf "$QT_PLUGIN_PATH"/sqldrivers
          rm -rf "$QT_PLUGIN_PATH"/help
          rm -rf "$QT_PLUGIN_PATH"/designer
          rm -rf "$QT_PLUGIN_PATH"/qmltooling
          rm -rf "$QT_PLUGIN_PATH"/qmlls
          rm -rf "$QT_PLUGIN_PATH"/qmllint
          rm -rf "$QT_PLUGIN_PATH"/platformthemes/libqgtk3.so

      # A true "run from anywhere" package, not just a bare binary+assets
      # tarball (the previous version of this step) — that only worked on
      # a machine that happened to already have the exact right Qt/SDL2/fmt
      # shared libraries installed, which the user's own SteamOS/Deck
      # hardware won't. `sharun lib4bin` is the same tool, and the same
      # invocation shape, the desktop build's own portable-tarball packaging
      # already uses (.github/actions/package/linux/action.yml) — it
      # resolves every shared library prismlauncher_bigscreen and the
      # bundled Qt plugins need and copies them alongside the binary, so
      # the result runs standalone without relying on anything from the
      # host system's package manager. Already available on PATH: the
      # shared setup-dependencies action installs it (and mkappimage/
      # AppImageUpdate, unused here) for every Linux job, BigScreen's
      # included.
      #
      # No cmake --install step first (unlike the desktop build) — BigScreen
      # has no install() rules of its own yet, so the binary is placed into
      # a bin/ dir by hand before handing it to sharun.
      #
      # --hard-links is required, not optional: bigscreen/main.cpp's
      # relocatable-resources lookup and Application::getJarPath() both
      # resolve paths relative to the running executable via
      # /proc/self/exe / QCoreApplication::applicationDirPath() — sharun's
      # own docs single out --hard-links as specifically what keeps that
      # resolving to the real "bin/prismlauncher_bigscreen" path (where our
      # own resources/jars actually get copied to, below) rather than
      # somewhere inside sharun's internal shared/ tree. --with-hooks packs
      # the extra runtime-loaded files some of these libraries need beyond
      # plain link-time dependencies (Qt plugin manifests etc.).
      - name: Package
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          stage="PrismLauncherBigScreen-${{ matrix.artifact-name }}"
          mkdir -p "$stage/bin"
          cp "build/$BUILD_TYPE/prismlauncher_bigscreen" "$stage/bin/"

          # Only present once the vendored Steamworks SDK is actually
          # committed (bigscreen/CMakeLists.txt's BIGSCREEN_HAVE_STEAMWORKS
          # block is entirely optional — see THIRDPARTY.md) — copied next to
          # the binary *before* sharun runs below so its own ldd-based
          # dependency resolution finds and bundles it via the BUILD_RPATH
          # CMake set at link time, same as any other linked .so.
          steamworks_lib="bigscreen/thirdparty/steamworks/lib/$( [ "${{ matrix.glibc-arch }}" = "aarch64" ] && echo linuxarm64 || echo linux64 )/libsteam_api.so"
          if [ -f "$steamworks_lib" ]; then
            cp "$steamworks_lib" "$stage/bin/"
          fi

          sharun lib4bin \
            --hard-links \
            --with-hooks \
            --dst-dir "$stage" \
            "$stage"/bin/* "$QT_PLUGIN_PATH"/*/*.so

          # Never ship libstdc++/libgcc_s or the graphics/windowing stack in
          # the bundle — both are meant to come from the host, not the build
          # machine. lib4bin has no --exclude flag, so this strips them from
          # the staged shared/lib/ after the fact; sharun's own generated
          # --library-path always falls back to /usr/lib:/lib once a bundled
          # candidate is gone (confirmed via LD_DEBUG=libs), so removing a
          # file here just means "resolve it from the host" instead of
          # "resolve it from the bundle" — every other bundled library is
          # untouched.
          #
          # Confirmed live (SSH) on real ARM hardware (a rolling-release
          # Arch Linux ARM build, glibc/Mesa newer than this CI runner's)
          # that bundling either family breaks the app on a host newer than
          # the build machine:
          #   - libstdc++/libgcc_s: nothing exotic here, just an old
          #     GLIBCXX_x.y.z symbol version — dlopen()'d native libraries
          #     (e.g. /usr/lib/libopenal.so) built against the host's newer
          #     libstdc++ failed with "GLIBCXX_3.4.35 not found" against the
          #     bundle's older one.
          #   - EGL/GL/Wayland stack: these must match the host compositor's
          #     protocol version and the host GPU driver's ABI, which is
          #     exactly why Valve's own Steam Runtime (pressure-vessel)
          #     mounts the host's graphics drivers into its container
          #     instead of bundling them — bundling an older
          #     libwayland-client.so.0 here made the host's own (newer)
          #     libEGL_mesa.so.0 fail with "undefined symbol:
          #     wl_fixes_interface" (a Wayland protocol interface added
          #     after this bundle's libwayland-client was built).
          #
          # libc.so.6/libm.so.6/libpthread/libdl/librt and ld-linux-*.so.*
          # itself are NOT excluded here — see the "Refresh glibc" step
          # below instead, which replaces them with current copies rather
          # than deleting them. sharun's own bundled loader (confirmed by
          # reading its source) only ever looks for the ELF interpreter
          # *inside* the bundle, by exact filename, with no host fallback at
          # all: deleting it doesn't make anything fall back to the host, it
          # just makes the whole package fail to start with "Interpreter not
          # found!" (reproduced live). And the interpreter is not an
          # ordinary dependency either: ld.so and libc.so.6 share private,
          # unversioned internal ABI and must come from the exact same
          # glibc build — confirmed live that pairing this bundle's own
          # ld.so with the host's newer libc.so.6 (leaving ld.so bundled,
          # deleting only libc.so.6) segfaults immediately (core dump). So
          # this whole family has to stay bundled *and* has to be new
          # enough for the host — see below.
          rm -f "$stage"/shared/lib/libstdc++.so.6 \
                "$stage"/shared/lib/libgcc_s.so.1 \
                "$stage"/shared/lib/libwayland-client.so.0 \
                "$stage"/shared/lib/libwayland-egl.so.1 \
                "$stage"/shared/lib/libwayland-cursor.so.0 \
                "$stage"/shared/lib/libEGL.so.1 \
                "$stage"/shared/lib/libGL.so.1 \
                "$stage"/shared/lib/libGLdispatch.so.0 \
                "$stage"/shared/lib/libGLX.so.0 \
                "$stage"/shared/lib/libOpenGL.so.0 \
                "$stage"/shared/lib/libgbm.so.1 \
                "$stage"/shared/lib/libdrm.so.2 \
                "$stage"/shared/lib/libxkbcommon.so.0 \
                "$stage"/shared/lib/libxkbcommon-x11.so.0

          echo "STAGE=$stage" >> "$GITHUB_ENV"

      # The remaining piece of the glibc problem above: ld.so/libc.so.6 have
      # to stay bundled *together* (no host fallback, must be a matched
      # pair — see the Package step), but this runner's own glibc
      # (ubuntu-24.04's, currently 2.39) is already older than the
      # rolling-release Arch-based systems BigScreen actually targets
      # (SteamOS, CachyOS, and the pocknix Arch Linux ARM build this was
      # debugged against directly) — and *any* host library that needs a
      # newer glibc symbol than this runner's, whether that's the host's
      # own Mesa/GPU driver stack (confirmed: GLIBC_2.43, dlopen'd
      # transitively) or something as ordinary as the host's own libm.so.6
      # depending on a newer libc.so.6 than bundled (confirmed on x86_64:
      # "version `GLIBC_ABI_DT_X86_64_PLT' not found (required by
      # /usr/lib/libm.so.6)"), breaks the app. Deleting individual files
      # one at a time to chase each specific missing symbol doesn't scale —
      # a different host library can always need a newer libc.so.6 than
      # whatever we happened to bundle, and libc.so.6 itself can't be
      # deleted (see above).
      #
      # Fixed at the root instead: replace the whole matched glibc-core set
      # (ld.so + libc/libm/libpthread/libdl/librt) with current copies
      # pulled directly from Arch's own package repos — Arch Linux proper
      # for x86_64, Arch Linux ARM (ALARM) for aarch64 — rather than
      # whatever this runner's own OS happens to ship. This isn't an
      # arbitrary substitute: BigScreen's real-world targets are
      # overwhelmingly Arch-family (SteamOS 3 is Arch-based; so are
      # CachyOS, Bazzite's base is different but still tracks current
      # kernels/Mesa; pocknix, the specific device this was debugged
      # against, *is* Arch Linux ARM), so sourcing from the same family
      # that's actually running on these devices — rather than a fixed
      # Ubuntu LTS snapshot that only gets older relative to a
      # rolling-release target — is the correct fix, not just a
      # workaround. Confirmed directly: the aarch64 ld.so pulled this way
      # is byte-identical in size to the one already running on the actual
      # pocknix device this bug was diagnosed on.
      #
      # Parses the repo's own package database (core.db — the same file
      # `pacman` itself uses to resolve package names to filenames) rather
      # than scraping a version number from anywhere, so this keeps working
      # as glibc gets updated upstream without needing any maintenance
      # here. tar auto-detects the archive's compression (zstd for Arch
      # proper, xz for ALARM) from its content, no extra flag needed.
      - name: Refresh glibc from Arch (${{ matrix.glibc-arch }})
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.glibc-arch }}" = "x86_64" ]; then
            mirror="https://geo.mirror.pkgbuild.com/core/os/x86_64"
          else
            mirror="http://mirror.archlinuxarm.org/aarch64/core"
          fi

          workdir="$(mktemp -d)"
          curl -sL --retry 3 --retry-connrefused "$mirror/core.db" -o "$workdir/core.db"
          pkgname="$(tar -tf "$workdir/core.db" | grep -E '^glibc-[0-9][^/]*/$' | head -1 | sed 's#/$##')"
          if [ -z "$pkgname" ]; then
            echo "Could not find glibc in $mirror/core.db" >&2
            exit 1
          fi
          echo "Using $pkgname from $mirror"

          # Arch packages (.pkg.tar.zst) and ALARM packages (.pkg.tar.xz)
          # use different compression, hence trying both extensions rather
          # than hardcoding one.
          pkgfile=""
          for ext in zst xz; do
            candidate="$pkgname-${{ matrix.glibc-arch }}.pkg.tar.$ext"
            if curl -sL --retry 3 --retry-connrefused -f "$mirror/$candidate" -o "$workdir/glibc.pkg.tar.$ext"; then
              pkgfile="$workdir/glibc.pkg.tar.$ext"
              break
            fi
          done
          if [ -z "$pkgfile" ]; then
            echo "Could not download $pkgname for ${{ matrix.glibc-arch }} from $mirror" >&2
            exit 1
          fi

          mkdir -p "$workdir/extracted"
          tar -xf "$pkgfile" -C "$workdir/extracted"

          for f in ld-linux-x86-64.so.2 ld-linux-aarch64.so.1 libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2 librt.so.1; do
            if [ -f "$workdir/extracted/usr/lib/$f" ]; then
              cp -fv "$workdir/extracted/usr/lib/$f" "$STAGE/shared/lib/$f"
              chmod +x "$STAGE/shared/lib/$f"
            fi
          done

          rm -rf "$workdir"

      # Must land next to the (hard-linked) binary in bin/ — that's exactly
      # what bigscreen/main.cpp's resource lookup and
      # Application::getJarPath() search for relative to the running
      # executable. jars/ (JavaCheck.jar + NewLaunch(Legacy).jar) is already
      # guaranteed to exist and be complete: prismlauncher_bigscreen's own
      # CMake target depends on all three (bigscreen/CMakeLists.txt).
      - name: Finalize package
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          cp -r bigscreen/resources "$STAGE/bin/"
          cp -r build/jars "$STAGE/bin/"

          # Confirmed necessary on a real device even when launched through
          # Steam as a non-Steam game shortcut (Big Picture, Steam Input) —
          # a real log showed SteamAPI_Init() failing with Steam's own
          # "No appID found. Either launch the game from Steam, or put the
          # file steam_appid.txt..." even though it *was* launched through
          # Steam, meaning Steam isn't reliably setting the SteamAppId/
          # SteamGameId env vars this flat SteamAPI_Init() would otherwise
          # read for a non-Steam-game entry. 480 is Valve's own official
          # SDK-development/testing AppID (Spacewar) — the standard,
          # widely-used choice for a project with no AppID of its own; if
          # this project ever gets a real registered Steamworks AppID,
          # replace this file's contents with that instead.
          if [ -f bigscreen/packaging/steam_appid.txt ]; then
            cp bigscreen/packaging/steam_appid.txt "$STAGE/bin/"
          fi

          tar -czf "$STAGE.tar.gz" "$STAGE"

      - name: Upload artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncherBigScreen-${{ matrix.artifact-name }}-Qt6
          path: PrismLauncherBigScreen-${{ matrix.artifact-name }}.tar.gz
          if-no-files-found: error

      # A real, double-clickable .AppImage (menu integration via .desktop/
      # icon/AppStream metadata), on top of the exact same staged AppDir the
      # portable tarball above was already tar'd from — the tarball is
      # created first, so decorating/mutating $STAGE afterward (adding the
      # desktop-integration files below, renaming the sharun loader to
      # AppRun) can't affect it. Requested explicitly instead of relying on
      # the plain portable tarball alone (a prior round deliberately chose
      # the tarball-only route for this kiosk-style app; revisited per
      # explicit ask for real .desktop-menu integration).
      #
      # sharun's own lib4bin (already run above, into $STAGE) always leaves
      # its loader binary at the AppDir root under the name "sharun" — that
      # exact file, renamed to "AppRun", is what mkappimage uses as the
      # image's entry point (same convention .github/actions/package/linux
      # already uses for the desktop build's own AppImage).
      - name: Package AppImage
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/share/applications" "$STAGE/share/icons/hicolor/256x256/apps" "$STAGE/share/metainfo"
          cp bigscreen/packaging/org.prismlauncher.bigscreen.desktop "$STAGE/share/applications/"
          cp bigscreen/packaging/org.prismlauncher.bigscreen.metainfo.xml "$STAGE/share/metainfo/"
          cp bigscreen/resources/images/icons/app.png "$STAGE/share/icons/hicolor/256x256/apps/org.prismlauncher.bigscreen.png"

          ln -s share/applications/org.prismlauncher.bigscreen.desktop "$STAGE/org.prismlauncher.bigscreen.desktop"
          ln -s share/icons/hicolor/256x256/apps/org.prismlauncher.bigscreen.png "$STAGE/org.prismlauncher.bigscreen.png"
          mv "$STAGE"/{sharun,AppRun}

          appimage_dest="PrismLauncherBigScreen-${{ matrix.artifact-name }}-${{ matrix.glibc-arch }}.AppImage"
          mkappimage "$STAGE" "$appimage_dest"
          echo "APPIMAGE_DEST=$appimage_dest" >> "$GITHUB_ENV"

      - name: Upload AppImage
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncherBigScreen-${{ matrix.artifact-name }}-AppImage
          path: ${{ env.APPIMAGE_DEST }}
          if-no-files-found: error

      # Windows: a portable folder — the exe plus everything it needs sitting
      # next to it. BigScreen has no install() rules (same reason the Linux
      # sharun step above assembles bin/ by hand), so:
      #  - windeployqt: Qt DLLs + plugins (platforms/qwindows, tls/schannel
      #    for every HTTPS request, imageformats incl. webp for modpack icons).
      #    Same trimming flags as the desktop build's own Qt deploy
      #    (launcher/CMakeLists.txt, QT_DEPLOY_TOOL_OPTIONS).
      #  - MSVC runtime DLLs copied app-local from the VS dev shell that
      #    setup-dependencies entered (VCToolsRedistDir), so it starts on a
      #    machine without the VC++ redistributable installed.
      #  - SDL2/fmt/libarchive/zlib/...: nothing to copy — this repo's
      #    Windows vcpkg triplet links them statically into the exe.
      #  - steam_api64.dll: already next to the exe (CMake post-build copy),
      #    plus the same steam_appid.txt the Linux package ships.
      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "PrismLauncherBigScreen-${{ matrix.artifact-name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bin = "build/$env:BUILD_TYPE"

          Copy-Item "$bin/prismlauncher_bigscreen.exe" $stage
          if (Test-Path "$bin/steam_api64.dll") { Copy-Item "$bin/steam_api64.dll" $stage }

          $windeployqt = Get-Command windeployqt -ErrorAction SilentlyContinue
          $windeployqt = if ($windeployqt) { $windeployqt.Source } else { Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe" }
          $mode = if ($env:BUILD_TYPE -eq 'Debug') { '--debug' } else { '--release' }
          & $windeployqt $mode --no-opengl-sw --no-quick-import --no-system-d3d-compiler --no-system-dxc-compiler `
            --skip-plugin-types generic,networkinformation "$stage/prismlauncher_bigscreen.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }

          $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir "x64") -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) { throw "MSVC CRT redist directory not found under $env:VCToolsRedistDir" }
          Copy-Item (Join-Path $crt.FullName "*.dll") $stage

          Copy-Item -Recurse bigscreen/resources (Join-Path $stage "resources")
          Copy-Item -Recurse build/jars (Join-Path $stage "jars")
          if (Test-Path bigscreen/packaging/steam_appid.txt) { Copy-Item bigscreen/packaging/steam_appid.txt $stage }

          "WINDOWS_STAGE=$stage" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV

      # Uploaded as the folder itself (not a pre-made .zip) — GitHub zips
      # artifacts on download anyway, so this avoids a zip-inside-a-zip.
      - name: Upload artifact (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncherBigScreen-${{ matrix.artifact-name }}
          path: ${{ env.WINDOWS_STAGE }}/
          if-no-files-found: error
